<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>永 · Brush Study</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #ded5c5; color: #302b28; font-family: Georgia, serif; }
    main { width: min(92vw, 680px); padding: 30px 0; }
    #art { width: 100%; display: block; box-shadow: 0 18px 55px #4d3e2b24; }
    .controls { display: flex; align-items: center; gap: 18px; margin-top: 22px; }
    button { border: 1px solid #8a7d67; background: transparent; color: inherit; padding: 10px 18px; font: inherit; cursor: pointer; min-width: 88px; }
    button:hover { background: #eee7da; }
    input { flex: 1; accent-color: #403830; cursor: pointer; }
    #clock { font: 14px Georgia,serif; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <main>
    <div id="art" aria-label="Animation of the character 永"></div>
    <div class="controls">
      <button id="toggle">Play</button>
      <input id="seek" aria-label="Timeline" type="range" min="0" max="8" step="0.01" value="0">
      <span id="clock">0:00 / 0:08</span>
    </div>
    <p><a href="poem.html" style="color:#615747">View the vertical poem →</a></p>
  </main>
  <script type="module">
    import { frameSVG, DURATION } from './src/animation.mjs';
    const art = document.querySelector('#art');
    const seek = document.querySelector('#seek');
    const toggle = document.querySelector('#toggle');
    const clock = document.querySelector('#clock');
    let t = 0, playing = false, last = 0;
    function draw() {
      art.innerHTML = frameSVG(t);
      seek.value = t;
      clock.textContent = `0:${String(Math.floor(t)).padStart(2, '0')} / 0:08`;
      toggle.textContent = playing ? 'Pause' : (t >= DURATION ? 'Replay' : 'Play');
    }
    function tick(now) {
      if (!playing) return;
      if (last) t = Math.min(DURATION, t + (now - last) / 1000);
      last = now;
      if (t >= DURATION) playing = false;
      draw();
      if (playing) requestAnimationFrame(tick);
    }
    toggle.onclick = () => {
      if (playing) { playing = false; last = 0; draw(); return; }
      if (t >= DURATION) t = 0;
      playing = true; last = 0; requestAnimationFrame(tick); draw();
    };
    seek.oninput = () => { t = Number(seek.value); last = 0; draw(); };
    draw();
  </script>
</body>
</html>
