<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>书法工坊 | Calligraphy Studio</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="studio-header">
      <div class="brand">
        <span class="seal-mark">墨</span>
        <h1>书法工坊 <span>Calligraphy Studio</span></h1>
      </div>
      <p class="tagline">基于汉字笔画拓扑与几何书写重构的开源书法视频工坊</p>
    </header>

    <main class="studio-main">
      <!-- Left Panel: Controls -->
      <section class="panel control-panel">
        <h2 class="panel-title">作品创作</h2>

        <div class="form-group">
          <label for="text-input">输入汉字文本 (1–80字)</label>
          <textarea id="text-input" rows="3" placeholder="输入要书写的汉字...">明月松间照</textarea>
          <div class="preset-chips">
            <span class="chip-label">快捷示例:</span>
            <button type="button" class="chip" data-text="明月松间照">明月松间照</button>
            <button type="button" class="chip" data-text="清泉石上流">清泉石上流</button>
            <button type="button" class="chip" data-text="永">永字八法</button>
          </div>
        </div>

        <div class="form-group">
          <label for="style-select">书法字体风格</label>
          <select id="style-select">
            <option value="kai">楷书 (Kai - Standard Script)</option>
            <option value="yan">颜体 (Yan - Robust Regular Script)</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group half">
            <label for="speed-select">书写速度</label>
            <select id="speed-select">
              <option value="0.75">0.75x 舒缓</option>
              <option value="1.0" selected>1.0x 标准</option>
              <option value="1.5">1.5x 畅快</option>
            </select>
          </div>
          <div class="form-group half">
            <label for="fps-select">帧率</label>
            <select id="fps-select">
              <option value="24" selected>24 fps (标准电影)</option>
              <option value="30">30 fps</option>
            </select>
          </div>
        </div>

        <div class="action-buttons">
          <button id="btn-preview" class="btn btn-secondary">
            <span class="btn-icon">👁</span> 预览静图 (Preview)
          </button>
          <button id="btn-render" class="btn btn-primary">
            <span class="btn-icon">▶</span> 生成书写视频 (Generate Video)
          </button>
        </div>

        <div id="status-message" class="status-message hidden"></div>
      </section>

      <!-- Right Panel: Preview & Output -->
      <section class="panel preview-panel">
        <h2 class="panel-title">实时预览与成品</h2>

        <div class="preview-stage">
          <div id="preview-placeholder" class="placeholder">
            <p>输入文本后点击「预览静图」查看构图，或直接「生成书写视频」</p>
          </div>
          <div id="preview-image-container" class="preview-box hidden">
            <img id="preview-img" src="" alt="Calligraphy Preview" />
          </div>
          <div id="video-container" class="preview-box hidden">
            <video id="result-video" controls autoplay loop playsinline></video>
          </div>
        </div>

        <!-- Session Job History -->
        <div class="jobs-section">
          <h3>生成任务记录 (当前会话)</h3>
          <div id="jobs-list" class="jobs-list">
            <p class="empty-jobs">暂无生成任务</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="studio-footer">
      <p>Calligraphy Engine · 无需注册 · 匿名会话自动保存 · 支持随时回来下载成品视频</p>
    </footer>
  </div>

  <script src="/app.js"></script>
</body>
</html>
