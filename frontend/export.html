<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>下載書法影片</title>
  <link rel="stylesheet" href="/export.css">
  <script src="/export.js" defer></script>
</head>
<body><main>
  <h1>下載書法影片</h1>
  <p>這個臨時連結只提供一部已完成的影片，無需重新生成。持有連結的人皆可下載，請勿轉傳。</p>
  <p>如仍在微信內，請用右上角「⋯」選擇「在瀏覽器中開啟」（如有），或複製完整連結，手動貼到 Safari／Chrome 網址列。</p>
  <p id="export-message" role="status">連結最長有效 10 分鐘。到期或影片已刪除時，請回原來的微信頁面重新建立。</p>
  <form id="export-form" method="post" hidden>
    <input id="export-token" name="token" type="hidden">
    <button type="submit">下載 MP4</button>
  </form>
  <p>Safari 下載後，可從下載項目或「檔案」App 開啟；如系統提供「儲存影片」，可再存入「照片」。</p>
  <noscript>請啟用 JavaScript 以讀取下載連結。</noscript>
</main></body></html>
