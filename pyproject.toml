[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "calligraphy-engine"
version = "0.1.0"
description = "Reusable geometric stroke and brush rendering algorithms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "CairoSVG>=2.7,<3",
  "fonttools>=4.50,<5",
  "numpy>=1.24,<3",
  "opencv-python-headless>=4.8,<5",
  "Pillow>=10,<13",
  "scikit-image>=0.22,<1",
  "scipy>=1.10,<2",
  "zhconv>=1.4.3,<2",
]

[tool.setuptools.packages.find]
include = ["calligraphy", "calligraphy.*"]
namespaces = false

[tool.setuptools.package-data]
calligraphy = ["assets/contact/*.json", "assets/contact/*.txt", "assets/data/*.json"]

[project.scripts]
calligraphy = "calligraphy.cli:main"
