version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: calligraphy_postgres
    restart: always
    environment:
      POSTGRES_DB: calligraphy
      POSTGRES_USER: calligraphy
      POSTGRES_PASSWORD: calligraphy_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: calligraphy_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  postgres_data:
